    <text x="802" y="540" font-size="11" fill="#5a6480">数据全在本地，Key 只进系统钥匙串</text>
    <text x="802" y="564" font-size="10" font-weight="600" fill="#f59e0b">无遥测 · 不落明文</text>
  </g>
</g>

