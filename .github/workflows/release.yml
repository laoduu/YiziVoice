name: Release

# 发版由 tag 推送触发，产物直接挂到 GitHub Release。
# 目的之一是让"已发布的二进制"可追溯到确定的源码：本机手工打包曾出现 tag 打好 7.5 小时后
# 才构建产物的情况，无法确证产物 == tag 的源码。release:check 会强制 HEAD 就是该 tag。
# 需要补跑时也可在 Actions 里手动运行本工作流，并把 ref 选成对应 tag。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      job:
        description: '要运行的 job:all / linux / windows / macos(默认 all)'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release:check 要 git rev-parse 该版本 tag,浅克隆不拉 tags 会误报「tag 不存在」
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - run: npm ci

      # workflow_dispatch 在 main 上跑时 github.ref 是分支名,softprops/action-gh-release
      # 会报「GitHub Releases requires a tag」;统一从 package.json 推导 tag。
      - id: ver
        shell: bash
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # 必须在构建前跑:此时工作区仍是干净的,且 HEAD 应等于本次触发的 tag
      - name: 发版前置校验(版本号三处一致 / 工作区干净 / HEAD == tag)
        run: npm run release:check

      - name: 构建 NSIS 安装包
        run: npm run tauri:build

      - name: 校验产物存在
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          if (-not $exe) { throw '未产出 NSIS 安装包' }
          $exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - run: npm ci

      - id: ver
        shell: bash
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: 发版前置校验
        run: npm run release:check

      # universal 构建:同时产出 arm64 与 x86_64,由 bundler 合并
      - name: 构建 .app / .dmg(universal,未签名)
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: 校验产物存在
        run: |
          ls -l src-tauri/target/universal-apple-darwin/release/bundle/dmg/
          test -n "$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'linux'
    # ubuntu-22.04 而非 ubuntu-latest:产物要求 glibc 兼容 22.04 基线,
    # 24.04(glibc 2.39)构建的 deb/AppImage 在 22.04 上直接跑不起来。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # Tauri 官方 Linux prerequisite + libdbus-1-dev(keyring 的 Secret Service
      # 走 dbus 绑定,build script 需要 pkg-config 找到 dbus-1)+ libfuse2
      # (bundler 运行 linuxdeploy 打 AppImage 时需要)。
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libfuse2

      - run: npm ci

      - id: ver
        shell: bash
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: 发版前置校验
        run: npm run release:check

      # --bundles 覆盖 tauri.conf.json 的 targets:否则 Linux 上会把 nsis
      # 也一并打出来(Tauri 支持 Linux 上构建 NSIS)。
      - name: 构建 deb / AppImage
        run: npm run tauri:build -- --bundles deb,appimage

      - name: 校验产物存在
        run: |
          ls -l src-tauri/target/release/bundle/deb/
          ls -l src-tauri/target/release/bundle/appimage/
          test -n "$(ls src-tauri/target/release/bundle/deb/*.deb)"
          test -n "$(ls src-tauri/target/release/bundle/appimage/*.AppImage)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          generate_release_notes: true
