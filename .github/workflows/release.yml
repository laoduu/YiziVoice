name: Release

# 发版由 tag 推送触发，产物直接挂到 GitHub Release。
# 目的之一是让"已发布的二进制"可追溯到确定的源码：本机手工打包曾出现 tag 打好 7.5 小时后
# 才构建产物的情况，无法确证产物 == tag 的源码。release:check 会强制 HEAD 就是该 tag。
# 需要补跑时也可在 Actions 里手动运行本工作流，并把 ref 选成对应 tag。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      job:
        description: '要运行的 job:all / linux / windows / macos(默认 all)'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release:check 要 git rev-parse 该版本 tag,浅克隆不拉 tags 会误报「tag 不存在」
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - run: npm ci

      # workflow_dispatch 在 main 上跑时 github.ref 是分支名,softprops/action-gh-release
      # 会报「GitHub Releases requires a tag」;统一从 package.json 推导 tag。
      - id: ver
        shell: bash
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # 必须在构建前跑:此时工作区仍是干净的,且 HEAD 应等于本次触发的 tag
      - name: 发版前置校验(版本号三处一致 / 工作区干净 / HEAD == tag)
        run: npm run release:check

      # 在线更新的 pubkey / endpoints 发出去就改不了（公钥被编进 exe），
      # 故意不进 npm run build，见 scripts/check-updater.mjs
      - name: 检查 updater 配置(pubkey / endpoints / installMode)
        run: npm run check:updater

      - name: 构建 NSIS 安装包(带 .sig 签名产物)
        # --config 合并 tauri.updater.conf.json 的 createUpdaterArtifacts=true：
        # 它会让构建强制要求签名私钥，写进 tauri.conf.json 会连带把本地 tauri:build 卡死
        run: npm run tauri:build -- --config src-tauri/tauri.updater.conf.json
        env:
          # 私钥内容(base64 文本),不是路径——bundler 只认这个变量
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 私钥无口令也要显式给空值,否则 CLI 走交互询问(CI 无 TTY 会挂)
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: 校验产物存在
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          if (-not $exe) { throw '未产出 NSIS 安装包' }
          $exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      # Release 正文 = CHANGELOG 该版本段（用户向：新增/优化/修复/其他），
      # 不用 generate_release_notes（那是 commit 列表，对用户无意义）
      - id: notes
        shell: bash
        run: |
          ver=$(node -p 'require("./package.json").version')
          out=release-notes.md
          awk -v pat="## [$ver]" 'index($0, pat)==1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > "$out"
          if [ ! -s "$out" ]; then echo "See CHANGELOG.md" > "$out"; fi
          echo "notes: $(head -3 "$out")"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          body_path: release-notes.md

      # 在线更新清单 latest.json：必须在安装包上传之后再传 ——
      # 客户端拿到清单就立刻去下产物，清单先到会撞上 404。
      # 平台键给两个(windows-x86_64-nsis 与 windows-x86_64)指向同一个安装包：
      # 插件按 {os}-{arch}-{installer} 再退到 {os}-{arch} 查找，少一个键就「查不到更新」。
      - name: 生成并上传更新清单 latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          setup=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          test -f "${setup}.sig" || { echo "::error::找不到 ${setup}.sig —— 构建没打开 createUpdaterArtifacts"; exit 1; }
          # 从 CHANGELOG 截取该版本段作为更新说明(标题形如 "## [2.1.4] - ...")
          notes_file=$(mktemp)
          awk -v pat="## [$ver]" 'index($0, pat)==1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > "$notes_file" || true
          node scripts/make-manifest.mjs \
            --version "$ver" \
            --notes "$notes_file" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --artifact "windows-x86_64-nsis=${setup}" \
            --artifact "windows-x86_64=${setup}" \
            --out .release_tmp/latest.json
          gh release upload "$GITHUB_REF_NAME" .release_tmp/latest.json --clobber
          echo "::notice::latest.json 已上传"

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - run: npm ci

      - id: ver
        shell: bash
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: 发版前置校验
        run: npm run release:check

      # 在线更新的 pubkey / endpoints 发出去就改不了（公钥被编进 exe），
      # 故意不进 npm run build，见 scripts/check-updater.mjs
      - name: 检查 updater 配置(pubkey / endpoints / installMode)
        run: npm run check:updater

      # universal 构建:同时产出 arm64 与 x86_64,由 bundler 合并
      - name: 构建 .app / .dmg(universal,未签名)
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: 校验产物存在
        run: |
          ls -l src-tauri/target/universal-apple-darwin/release/bundle/dmg/
          test -n "$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      # Release 正文 = CHANGELOG 该版本段（用户向：新增/优化/修复/其他），
      # 不用 generate_release_notes（那是 commit 列表，对用户无意义）
      - id: notes
        shell: bash
        run: |
          ver=$(node -p 'require("./package.json").version')
          out=release-notes.md
          awk -v pat="## [$ver]" 'index($0, pat)==1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > "$out"
          if [ ! -s "$out" ]; then echo "See CHANGELOG.md" > "$out"; fi
          echo "notes: $(head -3 "$out")"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          body_path: release-notes.md

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'linux'
    # ubuntu-22.04 而非 ubuntu-latest:产物要求 glibc 兼容 22.04 基线,
    # 24.04(glibc 2.39)构建的 deb/AppImage 在 22.04 上直接跑不起来。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # Tauri 官方 Linux prerequisite + libdbus-1-dev(keyring 的 Secret Service
      # 走 dbus 绑定,build script 需要 pkg-config 找到 dbus-1)+ libfuse2
      # (bundler 运行 linuxdeploy 打 AppImage 时需要)。
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libfuse2

      - run: npm ci

      - id: ver
        shell: bash
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: 发版前置校验
        run: npm run release:check

      # 在线更新的 pubkey / endpoints 发出去就改不了（公钥被编进 exe），
      # 故意不进 npm run build，见 scripts/check-updater.mjs
      - name: 检查 updater 配置(pubkey / endpoints / installMode)
        run: npm run check:updater

      # --bundles 覆盖 tauri.conf.json 的 targets:否则 Linux 上会把 nsis
      # 也一并打出来(Tauri 支持 Linux 上构建 NSIS)。
      - name: 构建 deb / AppImage
        run: npm run tauri:build -- --bundles deb,appimage

      - name: 校验产物存在
        run: |
          ls -l src-tauri/target/release/bundle/deb/
          ls -l src-tauri/target/release/bundle/appimage/
          test -n "$(ls src-tauri/target/release/bundle/deb/*.deb)"
          test -n "$(ls src-tauri/target/release/bundle/appimage/*.AppImage)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      # Release 正文 = CHANGELOG 该版本段（用户向：新增/优化/修复/其他），
      # 不用 generate_release_notes（那是 commit 列表，对用户无意义）
      - id: notes
        shell: bash
        run: |
          ver=$(node -p 'require("./package.json").version')
          out=release-notes.md
          awk -v pat="## [$ver]" 'index($0, pat)==1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > "$out"
          if [ ! -s "$out" ]; then echo "See CHANGELOG.md" > "$out"; fi
          echo "notes: $(head -3 "$out")"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          body_path: release-notes.md
