<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">YiziVoice — One-Stop Voice Studio</title>
<desc id="d">Text-to-speech, voice cloning and speech-to-text share one workspace. Text and audio go in, MiMo models produce speech or text. History, voice library and style control are shared, and the API key stays in the OS keychain.</desc>
<defs>
  <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#002FA7" stop-opacity=".18"/>
    <stop offset="1" stop-color="#002FA7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sweepG" x1="0" x2="1">
    <stop offset="0" stop-color="#002FA7" stop-opacity="0"/>
    <stop offset=".5" stop-color="#002FA7" stop-opacity=".12"/>
    <stop offset="1" stop-color="#002FA7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="wave1" x1="0" x2="1">
    <stop offset="0" stop-color="#002FA7" stop-opacity=".9"/>
    <stop offset="1" stop-color="#F37021" stop-opacity=".9"/>
  </linearGradient>
  <clipPath id="hubClip"><rect x="380" y="300" width="440" height="88" rx="44"/></clipPath>
  <style>
    .pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
    @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
    .march{animation:march 1.4s linear infinite}
    @keyframes march{to{stroke-dashoffset:-18}}
    .comet{animation:comet 6s linear infinite}
    @keyframes comet{to{stroke-dashoffset:-175.9}}
    .sweep{animation:sweep 3.6s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-90px)}60%,100%{transform:translateX(440px)}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:bar 1.1s ease-in-out infinite alternate}
    @keyframes bar{0%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
    .glow{animation:glow 2.2s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.25}50%{opacity:.85}}
    .float{animation:float 3.4s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.motion{display:none}}
  </style>
</defs>

<rect width="1200" height="675" rx="16" fill="#f7f8fc"/>

<g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <text x="600" y="56" text-anchor="middle" font-size="30" font-weight="800" fill="#1b2340"><tspan fill="#002FA7">Yizi</tspan><tspan fill="#F37021">Voice</tspan> · One-Stop Voice Studio</text>
  <text x="600" y="86" text-anchor="middle" font-size="13" letter-spacing=".5" fill="#5a6480">Text in, sound out; sound in, text out — clone, design, generate and transcribe in one workspace</text>
</g>

<!-- Top row: three abilities -->
<rect x="60" y="100" width="1080" height="176" rx="14" fill="#ffffff" stroke="#e8ecf4" stroke-width="1.2"/>
<g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <text x="84" y="126" font-size="12" font-weight="800" fill="#8a93ad" letter-spacing="1.2">THREE ABILITIES · ONE INPUT, MANY OUTPUTS</text>
</g>

<!-- Card 1: TTS -->
<g class="pop" style="animation-delay:0s">
  <rect x="84" y="146" width="330" height="112" rx="12" fill="#ffffff" stroke="#e8ecf4" stroke-width="1.2"/>
  <rect x="96" y="146.8" width="306" height="3" rx="1.5" fill="#002FA7"/>
  <circle cx="114" cy="178" r="15" fill="#002FA7" fill-opacity=".12"/>
  <g transform="translate(101 165)" fill="none" stroke="#002FA7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/>
  </g>
  <g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <text x="138" y="182" font-size="15" font-weight="700" fill="#1b2340">Text-to-Speech</text>
    <text x="102" y="212" font-size="11" fill="#5a6480">Type text, pick a voice, generate</text>
    <text x="102" y="236" font-size="10" font-weight="600" fill="#002FA7">mimo-v2.5-tts · 9 preset voices</text>
  </g>
  <!-- waveform motion -->
  <g transform="translate(322 176)" fill="url(#wave1)">
    <rect class="bar" x="0" y="-12" width="3" height="24" rx="1.5" style="animation-delay:0s"/>
    <rect class="bar" x="7" y="-16" width="3" height="32" rx="1.5" style="animation-delay:.12s"/>
    <rect class="bar" x="14" y="-10" width="3" height="20" rx="1.5" style="animation-delay:.24s"/>
    <rect class="bar" x="21" y="-14" width="3" height="28" rx="1.5" style="animation-delay:.36s"/>
    <rect class="bar" x="28" y="-8" width="3" height="16" rx="1.5" style="animation-delay:.48s"/>
    <rect class="bar" x="35" y="-12" width="3" height="24" rx="1.5" style="animation-delay:.6s"/>
  </g>
</g>

<!-- Card 2: voice cloning -->
<g class="pop" style="animation-delay:.10s">
  <rect x="434" y="146" width="330" height="112" rx="12" fill="#ffffff" stroke="#e8ecf4" stroke-width="1.2"/>
  <rect x="446" y="146.8" width="306" height="3" rx="1.5" fill="#F37021"/>
  <circle cx="464" cy="178" r="15" fill="#F37021" fill-opacity=".12"/>
  <g transform="translate(451 165)" fill="none" stroke="#F37021" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/>
  </g>
  <g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <text x="488" y="182" font-size="15" font-weight="700" fill="#1b2340">Voice Cloning</text>
    <text x="452" y="212" font-size="11" fill="#5a6480">20s sample turns your voice into a role</text>
    <text x="452" y="236" font-size="10" font-weight="600" fill="#F37021">voiceclone · categories · import/export</text>
  </g>
</g>

<!-- Card 3: STT -->
<g class="pop" style="animation-delay:.20s">
  <rect x="784" y="146" width="330" height="112" rx="12" fill="#ffffff" stroke="#e8ecf4" stroke-width="1.2"/>
  <rect x="796" y="146.8" width="306" height="3" rx="1.5" fill="#0ea5b7"/>
  <circle cx="814" cy="178" r="15" fill="#0ea5b7" fill-opacity=".12"/>
  <g transform="translate(801 165)" fill="none" stroke="#0ea5b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6h10M4 12h16M4 18h12"/><path d="M18 6l3 3-3 3"/>
  </g>
  <g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <text x="838" y="182" font-size="15" font-weight="700" fill="#1b2340">Speech-to-Text</text>
    <text x="802" y="212" font-size="11" fill="#5a6480">Record or upload audio, get text</text>
    <text x="802" y="236" font-size="10" font-weight="600" fill="#0ea5b7">mimo-v2.5-asr · ZH/EN + auto detect</text>
  </g>
</g>

<!-- marching-ant links: top → hub -->
<g fill="none" stroke="#c7cfe0" stroke-width="1.5" stroke-dasharray="3 5" class="march">
  <path d="M 249 258 L 440 306"/>
  <path d="M 599 258 L 600 306"/>
  <path d="M 949 258 L 760 306"/>
</g>

<!-- Hub: workspace -->
<g class="pop" style="animation-delay:.55s">
  <rect x="380" y="300" width="440" height="88" rx="44" fill="#ffffff" stroke="#e8ecf4" stroke-width="1.2"/>
  <g clip-path="url(#hubClip)">
    <rect class="sweep" x="380" y="300" width="90" height="88" fill="url(#sweepG)"/>
  </g>
  <circle cx="600" cy="344" r="44" fill="url(#hubGlow)" class="pulse"/>
  <circle cx="600" cy="344" r="28" fill="#eef1ff" stroke="#002FA7" stroke-opacity=".35" stroke-width="1.4"/>
  <circle cx="600" cy="344" r="28" fill="none" stroke="#F37021" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="44 131.9" class="comet"/>
  <g transform="translate(588 332)" fill="none" stroke="#002FA7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/>
  </g>
  <g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <text x="412" y="338" font-size="13" font-weight="700" fill="#1b2340">YiziVoice Workspace</text>
    <text x="412" y="356" font-size="10" fill="#8a93ad">React + Tauri 2 · ~10MB</text>
    <text x="634" y="338" font-size="13" font-weight="700" fill="#1b2340">MiMo Model Family</text>
    <text x="634" y="356" font-size="10" fill="#8a93ad">TTS / voiceclone / asr</text>
  </g>
</g>

<!-- hub → bottom row -->
<g fill="none" stroke="#c7cfe0" stroke-width="1.5" stroke-dasharray="3 5" class="march">
  <path d="M 430 388 L 249 468"/>
  <path d="M 600 388 L 599 468"/>
  <path d="M 770 388 L 949 468"/>
</g>

<!-- Bottom row: shared -->
<rect x="60" y="428" width="1080" height="176" rx="14" fill="#ffffff" stroke="#e8ecf4" stroke-width="1.2"/>
<g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <text x="84" y="454" font-size="12" font-weight="800" fill="#8a93ad" letter-spacing="1.2">SHARED · USED BY ALL THREE</text>
</g>

<!-- Card 4: history & restore -->
<g class="pop" style="animation-delay:.30s">
  <rect x="84" y="474" width="330" height="112" rx="12" fill="#ffffff" stroke="#e8ecf4" stroke-width="1.2"/>
  <rect x="96" y="474.8" width="306" height="3" rx="1.5" fill="#8b5cf6"/>
  <circle cx="114" cy="506" r="15" fill="#8b5cf6" fill-opacity=".12"/>
  <g transform="translate(101 493)" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/><path d="M4 6l2-2M20 6l-2-2"/>
  </g>
  <g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <text x="138" y="510" font-size="15" font-weight="700" fill="#1b2340">History &amp; Restore</text>
    <text x="102" y="540" font-size="11" fill="#5a6480">Every run saved, one-click restore</text>
    <text x="102" y="564" font-size="10" font-weight="600" fill="#8b5cf6">Play / Download / Restore</text>
  </g>
</g>

<!-- Card 5: style control -->
<g class="pop" style="animation-delay:.38s">
  <rect x="434" y="474" width="330" height="112" rx="12" fill="#ffffff" stroke="#e8ecf4" stroke-width="1.2"/>
  <rect x="446" y="474.8" width="306" height="3" rx="1.5" fill="#10b981"/>
  <circle cx="464" cy="506" r="15" fill="#10b981" fill-opacity=".12"/>
  <g transform="translate(451 493)" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18 16v4M16 18h4"/>
  </g>
  <g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <text x="488" y="510" font-size="15" font-weight="700" fill="#1b2340">Style Control</text>
    <text x="452" y="540" font-size="11" fill="#5a6480">Tags / paragraph / director mode</text>
    <text x="452" y="564" font-size="10" font-weight="600" fill="#10b981">12 presets · custom savable</text>
  </g>
</g>

<!-- Card 6: local & secure -->
<g class="pop" style="animation-delay:.46s">
  <rect x="784" y="474" width="330" height="112" rx="12" fill="#ffffff" stroke="#e8ecf4" stroke-width="1.2"/>
  <rect x="796" y="474.8" width="306" height="3" rx="1.5" fill="#f59e0b"/>
  <circle cx="814" cy="506" r="15" fill="#f59e0b" fill-opacity=".12"/>
  <g transform="translate(801 493)" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/>
  </g>
  <g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
    <text x="838" y="510" font-size="15" font-weight="700" fill="#1b2340">Local &amp; Secure</text>
    <text x="802" y="540" font-size="11" fill="#5a6480">Data stays local, key in OS keychain</text>
    <text x="802" y="564" font-size="10" font-weight="600" fill="#f59e0b">No telemetry · never plaintext</text>
  </g>
</g>

<!-- particles: top → hub -->
<g class="motion" fill="#F37021" opacity="0">
  <circle r="5" opacity=".18"/><circle r="2"/>
  <animateMotion path="M 249 258 L 440 306" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
</g>
<g class="motion" fill="#F37021" opacity="0">
  <circle r="5" opacity=".18"/><circle r="2"/>
  <animateMotion path="M 599 258 L 600 306" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
</g>
<g class="motion" fill="#F37021" opacity="0">
  <circle r="5" opacity=".18"/><circle r="2"/>
  <animateMotion path="M 949 258 L 760 306" dur="1.2s" begin="0.9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="1.2s" begin="0.9s" repeatCount="indefinite"/>
</g>

<!-- particles: hub → bottom -->
<g class="motion" fill="#002FA7" opacity="0">
  <circle r="5" opacity=".18"/><circle r="2"/>
  <animateMotion path="M 430 388 L 249 468" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
</g>
<g class="motion" fill="#002FA7" opacity="0">
  <circle r="5" opacity=".18"/><circle r="2"/>
  <animateMotion path="M 600 388 L 599 468" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
</g>
<g class="motion" fill="#002FA7" opacity="0">
  <circle r="5" opacity=".18"/><circle r="2"/>
  <animateMotion path="M 770 388 L 949 468" dur="1.5s" begin="1.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="1.5s" begin="1.8s" repeatCount="indefinite"/>
</g>

<!-- footer chips -->
<g font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" class="float">
  <rect x="330" y="628" width="220" height="28" rx="14" fill="#002FA7" fill-opacity=".08"/>
  <text x="440" y="647" text-anchor="middle" font-size="11" font-weight="700" fill="#002FA7">Windows · macOS · Linux</text>
  <rect x="570" y="628" width="180" height="28" rx="14" fill="#F37021" fill-opacity=".08"/>
  <text x="660" y="647" text-anchor="middle" font-size="11" font-weight="700" fill="#F37021">~10MB installer</text>
  <rect x="770" y="628" width="120" height="28" rx="14" fill="#1b2340" fill-opacity=".06"/>
  <text x="830" y="647" text-anchor="middle" font-size="11" font-weight="700" fill="#5a6480">MIT licensed</text>
</g>
</svg>
